title: Household Chores
views:
  - title: Chores
    path: chores
    icon: mdi:clipboard-check
    type: sections
    max_columns: 1
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Due now
            heading_style: title
          - type: custom:chores-card
            only_state: due
      - type: grid
        cards:
          - type: heading
            heading: Upcoming
            heading_style: title
          - type: custom:chores-card
            only_state: pending
